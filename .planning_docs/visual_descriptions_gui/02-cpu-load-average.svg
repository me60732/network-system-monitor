<?xml version="1.0" encoding="UTF-8"?>
<svg width="430" height="320" xmlns="http://www.w3.org/2000/svg">
  <title>CPU Load Average Settings Panel</title>
  
  <!-- Background -->
  <rect width="430" height="320" fill="#1a1a1a"/>
  
  <!-- Header -->
  <text x="20" y="35" fill="#999" font-size="14" font-family="sans-serif">← Back</text>
  <text x="20" y="70" fill="#fff" font-size="24" font-weight="bold" font-family="sans-serif">CPU Load Average</text>
  
  <!-- Left side - Ring chart -->
  <g transform="translate(70, 180)">
    <circle cx="0" cy="0" r="50" fill="none" stroke="#333" stroke-width="12"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#00bcd4" stroke-width="12" 
            stroke-dasharray="19 295" stroke-dashoffset="78.5" transform="rotate(-90)"/>
    <text x="0" y="5" fill="#fff" font-size="32" font-weight="bold" text-anchor="middle" font-family="sans-serif">3.03</text>
    <text x="0" y="75" fill="#aaa" font-size="14" text-anchor="middle" font-family="sans-serif">3.03%</text>
  </g>
  
  <!-- Right side - Toggle options -->
  <text x="200" y="125" fill="#ccc" font-size="13" font-family="sans-serif">Show chart</text>
  <rect x="360" y="112" width="45" height="24" rx="12" fill="#00bcd4"/>
  <circle cx="393" cy="124" r="10" fill="#fff"/>
  
  <text x="200" y="160" fill="#ccc" font-size="13" font-family="sans-serif">Show value</text>
  <rect x="360" y="147" width="45" height="24" rx="12" fill="#555"/>
  <circle cx="372" cy="159" r="10" fill="#999"/>
  
  <text x="200" y="195" fill="#ccc" font-size="13" font-family="sans-serif">Show label</text>
  <rect x="360" y="182" width="45" height="24" rx="12" fill="#555"/>
  <circle cx="372" cy="194" r="10" fill="#999"/>
  
  <text x="200" y="230" fill="#ccc" font-size="13" font-family="sans-serif">Show icon</text>
  <rect x="360" y="217" width="45" height="24" rx="12" fill="#00bcd4"/>
  <circle cx="393" cy="229" r="10" fill="#fff"/>
  
  <!-- Dropdowns -->
  <text x="200" y="270" fill="#ccc" font-size="13" font-family="sans-serif">Chart type</text>
  <rect x="280" y="257" width="70" height="26" rx="4" fill="#2a2a2a" stroke="#444" stroke-width="1"/>
  <text x="295" y="275" fill="#fff" font-size="12" font-family="sans-serif">Ring</text>
  <text x="330" y="275" fill="#999" font-size="12" font-family="sans-serif">▼</text>
  
  <rect x="360" y="257" width="50" height="26" rx="4" fill="#333"/>
  <text x="372" y="275" fill="#aaa" font-size="12" font-family="sans-serif">Colors</text>
</svg>
