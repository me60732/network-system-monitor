<?xml version="1.0" encoding="UTF-8"?>
<svg width="430" height="580" xmlns="http://www.w3.org/2000/svg">
  <title>Graphics (GPU) Settings Panel</title>
  
  <!-- Background with cyan border -->
  <rect width="430" height="580" fill="#1a1a1a" stroke="#00bcd4" stroke-width="3"/>
  
  <!-- Header -->
  <text x="20" y="35" fill="#999" font-size="14" font-family="sans-serif">← Back</text>
  <text x="20" y="70" fill="#fff" font-size="24" font-weight="bold" font-family="sans-serif">Graphics</text>
  
  <!-- GPU name -->
  <text x="20" y="105" fill="#fff" font-size="14" font-family="sans-serif">NVIDIA GeForce RTX 4090</text>
  
  <!-- Top-level toggles -->
  <text x="20" y="145" fill="#ccc" font-size="13" font-family="sans-serif">Show label</text>
  <rect x="360" y="132" width="45" height="24" rx="12" fill="#555"/>
  <circle cx="372" cy="144" r="10" fill="#999"/>
  
  <text x="20" y="180" fill="#ccc" font-size="13" font-family="sans-serif">Show icon</text>
  <rect x="360" y="167" width="45" height="24" rx="12" fill="#00bcd4"/>
  <circle cx="393" cy="179" r="10" fill="#fff"/>
  
  <!-- GPU load section -->
  <text x="20" y="225" fill="#fff" font-size="15" font-weight="bold" font-family="sans-serif">GPU load</text>
  
  <!-- Left side - Ring chart -->
  <g transform="translate(70, 310)">
    <circle cx="0" cy="0" r="50" fill="none" stroke="#333" stroke-width="12"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#00bcd4" stroke-width="12" 
            stroke-dasharray="12.5 301.5" stroke-dashoffset="78.5" transform="rotate(-90)"/>
    <text x="0" y="5" fill="#fff" font-size="32" font-weight="bold" text-anchor="middle" font-family="sans-serif">2.00</text>
    <text x="0" y="75" fill="#aaa" font-size="14" text-anchor="middle" font-family="sans-serif">2.00%</text>
  </g>
  
  <!-- Right side - GPU load toggles -->
  <text x="200" y="260" fill="#ccc" font-size="13" font-family="sans-serif">Show chart</text>
  <rect x="360" y="247" width="45" height="24" rx="12" fill="#00bcd4"/>
  <circle cx="393" cy="259" r="10" fill="#fff"/>
  
  <text x="200" y="295" fill="#ccc" font-size="13" font-family="sans-serif">Show value</text>
  <rect x="360" y="282" width="45" height="24" rx="12" fill="#555"/>
  <circle cx="372" cy="294" r="10" fill="#999"/>
  
  <text x="200" y="330" fill="#ccc" font-size="13" font-family="sans-serif">Chart type</text>
  <rect x="280" y="317" width="70" height="26" rx="4" fill="#2a2a2a" stroke="#444" stroke-width="1"/>
  <text x="295" y="335" fill="#fff" font-size="12" font-family="sans-serif">Ring</text>
  <text x="330" y="335" fill="#999" font-size="12" font-family="sans-serif">▼</text>
  
  <rect x="360" y="317" width="50" height="26" rx="4" fill="#333"/>
  <text x="372" y="335" fill="#aaa" font-size="12" font-family="sans-serif">Colors</text>
  
  <!-- GPU Temperature section -->
  <text x="20" y="390" fill="#fff" font-size="15" font-weight="bold" font-family="sans-serif">GPU Temperature</text>
  
  <!-- Left side - Ring chart -->
  <g transform="translate(70, 480)">
    <circle cx="0" cy="0" r="50" fill="none" stroke="#333" stroke-width="12"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#ff4444" stroke-width="12" 
            stroke-dasharray="125 189" stroke-dashoffset="78.5" transform="rotate(-90)"/>
    <text x="0" y="5" fill="#ff4444" font-size="32" font-weight="bold" text-anchor="middle" font-family="sans-serif">40°</text>
    <text x="0" y="75" fill="#aaa" font-size="14" text-anchor="middle" font-family="sans-serif">40°C</text>
  </g>
  
  <!-- Right side - GPU temp toggles -->
  <text x="200" y="425" fill="#ccc" font-size="13" font-family="sans-serif">Show chart</text>
  <rect x="360" y="412" width="45" height="24" rx="12" fill="#00bcd4"/>
  <circle cx="393" cy="424" r="10" fill="#fff"/>
  
  <text x="200" y="460" fill="#ccc" font-size="13" font-family="sans-serif">Show value</text>
  <rect x="360" y="447" width="45" height="24" rx="12" fill="#555"/>
  <circle cx="372" cy="459" r="10" fill="#999"/>
  
  <text x="200" y="495" fill="#ccc" font-size="13" font-family="sans-serif">Temperature unit</text>
  <rect x="325" y="482" width="85" height="26" rx="4" fill="#2a2a2a" stroke="#444" stroke-width="1"/>
  <text x="340" y="500" fill="#fff" font-size="12" font-family="sans-serif">Celsius</text>
  <text x="395" y="500" fill="#999" font-size="12" font-family="sans-serif">▼</text>
  
  <text x="200" y="530" fill="#ccc" font-size="13" font-family="sans-serif">Chart type</text>
  <rect x="280" y="517" width="70" height="26" rx="4" fill="#2a2a2a" stroke="#444" stroke-width="1"/>
  <text x="295" y="535" fill="#fff" font-size="12" font-family="sans-serif">Ring</text>
  <text x="330" y="535" fill="#999" font-size="12" font-family="sans-serif">▼</text>
  
  <rect x="360" y="517" width="50" height="26" rx="4" fill="#333"/>
  <text x="372" y="535" fill="#aaa" font-size="12" font-family="sans-serif">Colors</text>
  
  <!-- Input field -->
  <text x="200" y="565" fill="#ccc" font-size="13" font-family="sans-serif">Minimum temperature</text>
  <rect x="360" y="552" width="50" height="26" rx="4" fill="#2a2a2a" stroke="#444" stroke-width="1"/>
  <text x="375" y="570" fill="#fff" font-size="12" font-family="sans-serif">0</text>
</svg>
