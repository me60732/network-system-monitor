<?xml version="1.0" encoding="UTF-8"?>
<svg width="430" height="450" xmlns="http://www.w3.org/2000/svg">
  <title>Network Load Settings Panel</title>
  
  <!-- Background -->
  <rect width="430" height="450" fill="#1a1a1a"/>
  
  <!-- Header -->
  <text x="20" y="35" fill="#999" font-size="14" font-family="sans-serif">← Back</text>
  <text x="20" y="70" fill="#fff" font-size="24" font-weight="bold" font-family="sans-serif">Network load</text>
  
  <!-- Top-level toggles -->
  <text x="20" y="115" fill="#ccc" font-size="13" font-family="sans-serif">Combine download and upload</text>
  <rect x="360" y="102" width="45" height="24" rx="12" fill="#00bcd4"/>
  <circle cx="393" cy="114" r="10" fill="#fff"/>
  
  <text x="20" y="150" fill="#ccc" font-size="13" font-family="sans-serif">Show bandwidth in bytes</text>
  <rect x="360" y="137" width="45" height="24" rx="12" fill="#00bcd4"/>
  <circle cx="393" cy="149" r="10" fill="#fff"/>
  
  <text x="20" y="185" fill="#ccc" font-size="13" font-family="sans-serif">Show label</text>
  <rect x="360" y="172" width="45" height="24" rx="12" fill="#555"/>
  <circle cx="372" cy="184" r="10" fill="#999"/>
  
  <text x="20" y="220" fill="#ccc" font-size="13" font-family="sans-serif">Show icon</text>
  <rect x="360" y="207" width="45" height="24" rx="12" fill="#555"/>
  <circle cx="372" cy="219" r="10" fill="#999"/>
  
  <!-- Network load section -->
  <text x="20" y="265" fill="#fff" font-size="15" font-weight="bold" font-family="sans-serif">Network load in bytes per second</text>
  
  <!-- Small chart thumbnail -->
  <rect x="35" y="285" width="60" height="60" rx="4" fill="#0a0a0a" stroke="#444" stroke-width="1"/>
  <rect x="45" y="325" width="4" height="15" fill="#4ade80"/>
  <rect x="52" y="330" width="4" height="10" fill="#4ade80"/>
  <rect x="59" y="335" width="4" height="5" fill="#4ade80"/>
  <rect x="66" y="332" width="4" height="8" fill="#4ade80"/>
  <rect x="73" y="328" width="4" height="12" fill="#4ade80"/>
  
  <text x="120" y="305" fill="#ccc" font-size="13" font-family="sans-serif">Show chart</text>
  <rect x="360" y="292" width="45" height="24" rx="12" fill="#555"/>
  <circle cx="372" cy="304" r="10" fill="#999"/>
  
  <text x="120" y="340" fill="#ccc" font-size="13" font-family="sans-serif">Show value</text>
  <rect x="360" y="327" width="45" height="24" rx="12" fill="#00bcd4"/>
  <circle cx="393" cy="339" r="10" fill="#fff"/>
  
  <text x="120" y="375" fill="#ccc" font-size="13" font-family="sans-serif">Use adaptive scale</text>
  <rect x="360" y="362" width="18" height="18" rx="3" fill="#00bcd4"/>
  <polyline points="363,370 368,375 375,365" fill="none" stroke="#fff" stroke-width="2"/>
  
  <!-- Display values -->
  <text x="35" y="405" fill="#4ade80" font-size="13" font-family="monospace">↓ 3.15 KB/s</text>
  <text x="35" y="425" fill="#00bcd4" font-size="13" font-family="monospace">↑ 1.96 KB/s</text>
  
  <rect x="340" y="390" width="70" height="26" rx="4" fill="#333"/>
  <text x="360" y="408" fill="#aaa" font-size="12" font-family="sans-serif">Colors</text>
</svg>
