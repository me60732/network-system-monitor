<?xml version="1.0" encoding="UTF-8"?>
<svg width="430" height="380" xmlns="http://www.w3.org/2000/svg">
  <title>Main System Monitor Menu/Overview</title>
  
  <!-- Background -->
  <rect width="430" height="380" fill="#1a1a1a"/>
  
  <!-- Header button -->
  <rect x="120" y="20" width="190" height="32" rx="6" fill="#2a2a2a"/>
  <text x="135" y="42" fill="#fff" font-size="13" font-family="sans-serif">COSMIC System Monitor</text>
  <text x="290" y="42" fill="#00bcd4" font-size="13" font-family="sans-serif">⧉</text>
  
  <!-- General settings -->
  <rect x="20" y="75" width="390" height="40" rx="4" fill="#2a2a2a"/>
  <text x="40" y="100" fill="#fff" font-size="14" font-family="sans-serif">General settings</text>
  <text x="385" y="100" fill="#999" font-size="16" font-family="sans-serif">›</text>
  
  <!-- Metric rows -->
  <rect x="20" y="125" width="390" height="36" rx="4" fill="#2a2a2a"/>
  <text x="40" y="148" fill="#fff" font-size="14" font-family="sans-serif">CPU</text>
  <text x="350" y="148" fill="#aaa" font-size="13" font-family="sans-serif">0.60%</text>
  <text x="385" y="148" fill="#999" font-size="16" font-family="sans-serif">›</text>
  
  <rect x="20" y="168" width="390" height="36" rx="4" fill="#2a2a2a"/>
  <text x="40" y="191" fill="#fff" font-size="14" font-family="sans-serif">CPU Temperature</text>
  <text x="355" y="191" fill="#aaa" font-size="13" font-family="sans-serif">35°C</text>
  <text x="385" y="191" fill="#999" font-size="16" font-family="sans-serif">›</text>
  
  <rect x="20" y="211" width="390" height="36" rx="4" fill="#2a2a2a"/>
  <text x="40" y="234" fill="#fff" font-size="14" font-family="sans-serif">Memory</text>
  <text x="220" y="234" fill="#aaa" font-size="13" font-family="sans-serif">29.7 GB / 43.7 GB / 125.6 GB</text>
  <text x="385" y="234" fill="#999" font-size="16" font-family="sans-serif">›</text>
  
  <rect x="20" y="254" width="390" height="36" rx="4" fill="#2a2a2a"/>
  <text x="40" y="277" fill="#fff" font-size="14" font-family="sans-serif">Network</text>
  <text x="255" y="277" fill="#aaa" font-size="13" font-family="sans-serif">↓ 1.67 KB/s ↑ 1.50 KB/s</text>
  <text x="385" y="277" fill="#999" font-size="16" font-family="sans-serif">›</text>
  
  <rect x="20" y="297" width="390" height="36" rx="4" fill="#2a2a2a"/>
  <text x="40" y="320" fill="#fff" font-size="14" font-family="sans-serif">Disk</text>
  <text x="250" y="320" fill="#aaa" font-size="13" font-family="sans-serif">W 2.28 GB/s ↑ 81.2 MB/s</text>
  <text x="385" y="320" fill="#999" font-size="16" font-family="sans-serif">›</text>
  
  <rect x="20" y="340" width="390" height="36" rx="4" fill="#2a2a2a"/>
  <text x="40" y="363" fill="#fff" font-size="14" font-family="sans-serif">GPU</text>
  <text x="210" y="363" fill="#aaa" font-size="13" font-family="sans-serif">0.00% 3.19 GB / 23.99 GB 41°C</text>
  <text x="385" y="363" fill="#999" font-size="16" font-family="sans-serif">›</text>
</svg>
