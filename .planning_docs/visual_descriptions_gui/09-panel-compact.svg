<?xml version="1.0" encoding="UTF-8"?>
<svg width="620" height="50" xmlns="http://www.w3.org/2000/svg">
  <title>Panel/Taskbar Compact View</title>
  
  <!-- Background -->
  <rect width="620" height="50" fill="#1a1a1a"/>
  
  <!-- CPU icon and value -->
  <g transform="translate(15, 25)">
    <rect x="-8" y="-8" width="16" height="16" rx="2" fill="none" stroke="#999" stroke-width="1.5"/>
    <rect x="-4" y="-4" width="8" height="8" fill="#999"/>
  </g>
  <text x="35" y="30" fill="#fff" font-size="14" font-family="monospace">0.90</text>
  
  <!-- Temperature icon and value -->
  <g transform="translate(100, 25)">
    <circle cx="0" cy="-3" r="4" fill="none" stroke="#ff4444" stroke-width="1.5"/>
    <rect x="-1.5" y="1" width="3" height="8" fill="#ff4444"/>
  </g>
  <circle cx="100" cy="15" r="18" fill="none" stroke="#ff4444" stroke-width="2"/>
  <text x="118" y="30" fill="#fff" font-size="14" font-family="monospace">34°</text>
  
  <!-- Memory icon and value -->
  <g transform="translate(185, 25)">
    <rect x="-6" y="-8" width="3" height="16" fill="#999"/>
    <rect x="-1" y="-8" width="3" height="16" fill="#999"/>
    <rect x="4" y="-8" width="3" height="16" fill="#999"/>
  </g>
  <text x="205" y="30" fill="#fff" font-size="14" font-family="monospace">3.00</text>
  
  <!-- GPU Temperature icon and value -->
  <g transform="translate(280, 25)">
    <circle cx="0" cy="-3" r="4" fill="none" stroke="#ff4444" stroke-width="1.5"/>
    <rect x="-1.5" y="1" width="3" height="8" fill="#ff4444"/>
  </g>
  <circle cx="280" cy="15" r="18" fill="none" stroke="#ff4444" stroke-width="2"/>
  <text x="298" y="30" fill="#fff" font-size="14" font-family="monospace">41°</text>
  
  <!-- GPU Load -->
  <g transform="translate(365, 25)">
    <rect x="-8" y="-8" width="16" height="16" rx="2" fill="none" stroke="#00bcd4" stroke-width="1.5"/>
    <text x="0" y="3" fill="#00bcd4" font-size="8" text-anchor="middle" font-family="sans-serif">G</text>
  </g>
  <text x="385" y="30" fill="#fff" font-size="14" font-family="monospace">3.17</text>
  
  <!-- Network icon and value -->
  <g transform="translate(450, 25)">
    <rect x="-2" y="-8" width="4" height="4" fill="#999"/>
    <rect x="-2" y="-2" width="4" height="7" fill="#999"/>
    <rect x="-2" y="7" width="4" height="3" fill="#999"/>
  </g>
  <text x="470" y="30" fill="#fff" font-size="14" font-family="monospace">29.4</text>
  
  <!-- Network bandwidth -->
  <text x="530" y="22" fill="#4ade80" font-size="11" font-family="monospace">↓ 4.49 KB/s</text>
  <text x="530" y="38" fill="#00bcd4" font-size="11" font-family="monospace">↑ 1.61 KB/s</text>
</svg>
