<?xml version="1.0" encoding="UTF-8"?>
<svg width="430" height="460" xmlns="http://www.w3.org/2000/svg">
  <title>Memory Usage Settings Panel</title>
  
  <!-- Background -->
  <rect width="430" height="460" fill="#1a1a1a"/>
  
  <!-- Header -->
  <text x="20" y="35" fill="#999" font-size="14" font-family="sans-serif">← Back</text>
  <text x="20" y="70" fill="#fff" font-size="24" font-weight="bold" font-family="sans-serif">Memory Usage</text>
  
  <!-- Left side - Ring chart -->
  <g transform="translate(70, 220)">
    <circle cx="0" cy="0" r="50" fill="none" stroke="#333" stroke-width="12"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#00bcd4" stroke-width="12" 
            stroke-dasharray="190 124" stroke-dashoffset="78.5" transform="rotate(-90)"/>
    <text x="0" y="5" fill="#fff" font-size="32" font-weight="bold" text-anchor="middle" font-family="sans-serif">30.0</text>
    <text x="0" y="75" fill="#aaa" font-size="14" text-anchor="middle" font-family="sans-serif">29.9 GB</text>
  </g>
  
  <!-- Right side - Toggle options -->
  <text x="200" y="120" fill="#ccc" font-size="13" font-family="sans-serif">Show chart</text>
  <rect x="360" y="107" width="45" height="24" rx="12" fill="#00bcd4"/>
  <circle cx="393" cy="119" r="10" fill="#fff"/>
  
  <text x="200" y="155" fill="#ccc" font-size="13" font-family="sans-serif">Show allocated on chart</text>
  <rect x="360" y="142" width="45" height="24" rx="12" fill="#555"/>
  <circle cx="372" cy="154" r="10" fill="#999"/>
  
  <!-- Info text -->
  <text x="200" y="185" fill="#888" font-size="11" font-family="sans-serif">Allocated = total minus free. Includes system</text>
  <text x="200" y="200" fill="#888" font-size="11" font-family="sans-serif">cache and buffers, which improve performance</text>
  <text x="200" y="215" fill="#888" font-size="11" font-family="sans-serif">and are resized/released as needed.</text>
  
  <text x="200" y="250" fill="#ccc" font-size="13" font-family="sans-serif">Show value</text>
  <rect x="360" y="237" width="45" height="24" rx="12" fill="#555"/>
  <circle cx="372" cy="249" r="10" fill="#999"/>
  
  <text x="200" y="285" fill="#ccc" font-size="13" font-family="sans-serif">Show label</text>
  <rect x="360" y="272" width="45" height="24" rx="12" fill="#555"/>
  <circle cx="372" cy="284" r="10" fill="#999"/>
  
  <text x="200" y="320" fill="#ccc" font-size="13" font-family="sans-serif">Show icon</text>
  <rect x="360" y="307" width="45" height="24" rx="12" fill="#00bcd4"/>
  <circle cx="393" cy="319" r="10" fill="#fff"/>
  
  <text x="200" y="355" fill="#ccc" font-size="13" font-family="sans-serif">As percentage</text>
  <rect x="360" y="342" width="45" height="24" rx="12" fill="#555"/>
  <circle cx="372" cy="354" r="10" fill="#999"/>
  
  <!-- Dropdowns -->
  <text x="200" y="395" fill="#ccc" font-size="13" font-family="sans-serif">Chart type</text>
  <rect x="280" y="382" width="70" height="26" rx="4" fill="#2a2a2a" stroke="#444" stroke-width="1"/>
  <text x="295" y="400" fill="#fff" font-size="12" font-family="sans-serif">Ring</text>
  <text x="330" y="400" fill="#999" font-size="12" font-family="sans-serif">▼</text>
  
  <rect x="360" y="382" width="50" height="26" rx="4" fill="#333"/>
  <text x="372" y="400" fill="#aaa" font-size="12" font-family="sans-serif">Colors</text>
</svg>
