<?xml version="1.0" encoding="UTF-8"?>
<svg width="430" height="600" xmlns="http://www.w3.org/2000/svg">
  <title>General Settings Panel</title>
  
  <!-- Background -->
  <rect width="430" height="600" fill="#1a1a1a"/>
  
  <!-- Header -->
  <text x="20" y="35" fill="#999" font-size="14" font-family="sans-serif">← Back</text>
  <text x="20" y="70" fill="#fff" font-size="24" font-weight="bold" font-family="sans-serif">General settings</text>
  
  <!-- Version info -->
  <text x="20" y="105" fill="#aaa" font-size="12" font-family="sans-serif">Minimon version 1.1.2 for COSMIC.</text>
  <circle cx="390" cy="100" r="12" fill="#ff4444"/>
  <text x="386" y="106" fill="#fff" font-size="14" font-weight="bold" font-family="sans-serif">?</text>
  
  <!-- Refresh rate -->
  <text x="20" y="145" fill="#ccc" font-size="13" font-family="sans-serif">Refresh rate (seconds)</text>
  <rect x="290" y="130" width="30" height="26" rx="4" fill="#333"/>
  <text x="302" y="148" fill="#fff" font-size="14" font-family="sans-serif">−</text>
  <rect x="325" y="130" width="50" height="26" rx="4" fill="#2a2a2a" stroke="#444" stroke-width="1"/>
  <text x="340" y="148" fill="#fff" font-size="13" font-family="monospace">1.00</text>
  <rect x="380" y="130" width="30" height="26" rx="4" fill="#333"/>
  <text x="391" y="148" fill="#fff" font-size="14" font-family="sans-serif">+</text>
  
  <!-- Value size -->
  <text x="20" y="190" fill="#ccc" font-size="13" font-family="sans-serif">Value size</text>
  <rect x="290" y="175" width="30" height="26" rx="4" fill="#333"/>
  <text x="302" y="193" fill="#fff" font-size="14" font-family="sans-serif">−</text>
  <rect x="325" y="175" width="50" height="26" rx="4" fill="#2a2a2a" stroke="#444" stroke-width="1"/>
  <text x="345" y="193" fill="#fff" font-size="13" font-family="monospace">11</text>
  <rect x="380" y="175" width="30" height="26" rx="4" fill="#333"/>
  <text x="391" y="193" fill="#fff" font-size="14" font-family="sans-serif">+</text>
  
  <!-- Monospace checkbox -->
  <text x="20" y="230" fill="#ccc" font-size="13" font-family="sans-serif">Monospace font for values</text>
  <rect x="360" y="217" width="18" height="18" rx="3" fill="none" stroke="#666" stroke-width="2"/>
  
  <!-- Panel spacing slider -->
  <text x="20" y="270" fill="#ccc" font-size="13" font-family="sans-serif">Panel spacing</text>
  <text x="230" y="270" fill="#aaa" font-size="12" font-family="sans-serif">Small</text>
  <line x1="280" y1="265" x2="360" y2="265" stroke="#555" stroke-width="4" stroke-linecap="round"/>
  <circle cx="320" cy="265" r="8" fill="#00bcd4"/>
  <text x="375" y="270" fill="#aaa" font-size="12" font-family="sans-serif">Large</text>
  
  <!-- System Monitor dropdown -->
  <text x="20" y="310" fill="#ccc" font-size="13" font-family="sans-serif">System Monitor</text>
  <text x="390" y="310" fill="#999" font-size="14" font-family="sans-serif">▼</text>
  
  <!-- Content order -->
  <text x="20" y="350" fill="#ccc" font-size="13" font-family="sans-serif">Content order</text>
  
  <!-- Reorderable items -->
  <g transform="translate(0, 365)">
    <text x="230" y="15" fill="#999" font-size="12" font-family="sans-serif">▲</text>
    <text x="260" y="15" fill="#999" font-size="12" font-family="sans-serif">▼</text>
    <text x="290" y="15" fill="#fff" font-size="13" font-family="sans-serif">CPU</text>
  </g>
  
  <g transform="translate(0, 405)">
    <text x="230" y="15" fill="#999" font-size="12" font-family="sans-serif">▲</text>
    <text x="260" y="15" fill="#999" font-size="12" font-family="sans-serif">▼</text>
    <text x="290" y="15" fill="#fff" font-size="13" font-family="sans-serif">CPU Temperature</text>
  </g>
  
  <g transform="translate(0, 445)">
    <text x="230" y="15" fill="#999" font-size="12" font-family="sans-serif">▲</text>
    <text x="260" y="15" fill="#999" font-size="12" font-family="sans-serif">▼</text>
    <text x="290" y="15" fill="#fff" font-size="13" font-family="sans-serif">GPU</text>
  </g>
  
  <g transform="translate(0, 485)">
    <text x="230" y="15" fill="#999" font-size="12" font-family="sans-serif">▲</text>
    <text x="260" y="15" fill="#999" font-size="12" font-family="sans-serif">▼</text>
    <text x="290" y="15" fill="#fff" font-size="13" font-family="sans-serif">Memory</text>
  </g>
  
  <g transform="translate(0, 525)">
    <text x="230" y="15" fill="#999" font-size="12" font-family="sans-serif">▲</text>
    <text x="260" y="15" fill="#999" font-size="12" font-family="sans-serif">▼</text>
    <text x="290" y="15" fill="#fff" font-size="13" font-family="sans-serif">Network</text>
  </g>
  
  <g transform="translate(0, 565)">
    <text x="230" y="15" fill="#999" font-size="12" font-family="sans-serif">▲</text>
    <text x="260" y="15" fill="#999" font-size="12" font-family="sans-serif">▼</text>
    <text x="290" y="15" fill="#fff" font-size="13" font-family="sans-serif">Disk</text>
  </g>
</svg>
