[package]
name = "nmd-service"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Remote systemd service for Network System Monitor — pushes rkyv-encoded MetricPacket via UDP with ChaCha20-Poly1305 AEAD encryption."

[dependencies]
# Shared metric collection library (same workspace)
metrics-core = { path = "../metrics-core" }

# Serialization: rkyv for zero-copy packet encoding (rkyv 0.8.x: derive macros built-in)
rkyv = { workspace = true, features = ["alloc"] }

# ChaCha20-Poly1305 AEAD encryption for packet transport (Pairing System V1, Phase 1)
chacha20poly1305 = { workspace = true }

# Ed25519 identity keypair generation/storage (used for ECDH pairing in Phase 2)
ed25519-dalek = { workspace = true }

# OsRng for keypair + nonce-prefix generation
rand = { workspace = true }

# System info for machine_id and uptime collection at service level
sysinfo = { workspace = true }
procfs = { workspace = true }

# Configuration parsing (TOML)
toml = { version = "0.8", default-features = false, features = ["parse"] }
serde = { version = "1.0", features = ["derive"] }

# CLI argument parsing and logging
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"

# Signal handling for graceful SIGTERM/SIGINT shutdown (Worf Phase 1A)
signal-hook = "0.3"
munge = "0.4"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "packet_bench"
harness = false

[[bench]]
name = "aggregator_bench"
harness = false
