[workspace]
members = [
    "metrics-core",
    "nmd-service",
    "cosmic-applet",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mark/network-system-monitor"

# Shared dependency versions for consistency across all crates
[workspace.dependencies]
# sysinfo 0.39.x — CPU/memory/disk/network/uptime collection via /proc and /sys on Linux.
# Temperature & GPU sensors use direct /sys reads (same approach as minimon-applet).
sysinfo = "0.39"
procfs = "0.17"
# rkyv 0.8.x: derive macros are included in the core crate (no separate 'derive' feature needed).
# rkyv 0.8.x: derive macros are included in the core crate (no separate 'derive' feature needed).
# The 'alloc' feature enables Vec/String support for ArchivedString and heap-allocated archives.
# The 'bytecheck' feature is required alongside 'alloc' to enable rkyv::access() zero-copy deserialization.
rkyv = { version = "0.8", default-features = false, features = ["alloc", "bytecheck"] }
serde = { version = "1.0", features = ["derive"] }

# ChaCha20-Poly1305 AEAD encryption for MetricPacket transport (Pairing System V1, Phase 1).
# Replaces HMAC-SHA256: one encrypt/decrypt operation gives confidentiality + authenticity.
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }

# Ed25519 identity keypairs for the pairing system (Phase 2 will use these for ECDH/signing).
# 'rand_core' feature enables SigningKey::generate(&mut OsRng).
ed25519-dalek = { version = "2.1", default-features = false, features = ["std", "rand_core"] }

# X25519 for ECDH key exchange in the pairing system (Phase 2).
# 'static_secrets' feature enables StaticSecret::from/derive.
x25519-dalek = { version = "2", features = ["static_secrets"] }

# chrono for datetime serialization in pairing.toml config files.
chrono = { version = "0.4", features = ["serde"] }

# Random number generation (nonce prefixes, keypair generation via rand::rngs::OsRng).
rand = { version = "0.8", features = ["std"] }

# Hex encoding/decoding for X25519 public key serialization in config
hex = { version = "0.4", features = ["serde"] }

# Development dependencies (shared) - cannot be 'optional' at workspace level
criterion = { version = "0.5" }
