name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.2.0) — leave blank to build HEAD without publishing'
        required: false

# Cancel any in-progress run for the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Build nmd-service (sender) ──────────────────────────────────────────
  build-nmd-service:
    name: nmd-service (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-24.04
          - arch: aarch64
            os: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libudev-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: nmd-service-${{ matrix.arch }}

      - name: Build nmd-service
        run: cargo build --release -p nmd-service

      - name: Package
        run: |
          ASSET="nmd-service-${{ matrix.arch }}-linux.tar.gz"
          tar -czf "$ASSET" -C target/release nmd-service
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: nmd-service-${{ matrix.arch }}-linux
          path: ${{ env.ASSET }}
          retention-days: 7

  # ── Build cosmic-applet (receiver) ─────────────────────────────────────
  build-cosmic-applet:
    name: cosmic-applet (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-24.04
          - arch: aarch64
            os: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            clang \
            cmake \
            libxkbcommon-dev \
            libwayland-dev \
            libdbus-1-dev \
            libudev-dev \
            libinput-dev \
            libgbm-dev \
            libseat-dev \
            libssl-dev \
            libegl-dev \
            libpipewire-0.3-dev \
            libfontconfig-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: cosmic-applet-${{ matrix.arch }}

      - name: Build cosmic-applet
        run: cargo build --release -p cosmic-applet

      - name: Package
        run: |
          ASSET="cosmic-applet-${{ matrix.arch }}-linux.tar.gz"
          mkdir -p _pkg
          cp target/release/cosmic-applet _pkg/
          cp -r cosmic-applet/res/. _pkg/res/
          tar -czf "$ASSET" -C _pkg .
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: cosmic-applet-${{ matrix.arch }}-linux
          path: ${{ env.ASSET }}
          retention-days: 7

  # ── Create GitHub Release ───────────────────────────────────────────────
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-nmd-service, build-cosmic-applet]
    # Only publish when a version tag was pushed (not workflow_dispatch without a tag)
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Generate checksums
        run: |
          cd dist
          find . -name '*.tar.gz' -exec sha256sum {} \; | sort > sha256sums.txt
          cat sha256sums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: "Network System Monitor ${{ github.ref_name }}"
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/**/*.tar.gz
            dist/sha256sums.txt
          body: |
            ## Network System Monitor ${{ github.ref_name }}

            ### One-line install

            ```bash
            curl -fsSL https://raw.githubusercontent.com/me60732/network-system-monitor/main/install.sh | sudo bash
            ```

            Or download a specific binary below and follow the [manual install docs](https://github.com/me60732/network-system-monitor#installation).

            ---

            ### Release assets

            | Component | Architecture | Notes |
            |-----------|-------------|-------|
            | `nmd-service-x86_64-linux.tar.gz` | x86_64 | Sender — runs on any Linux machine |
            | `nmd-service-aarch64-linux.tar.gz` | ARM64 | Sender — Raspberry Pi 4/5, ARM servers |
            | `cosmic-applet-x86_64-linux.tar.gz` | x86_64 | Receiver — requires COSMIC desktop |
            | `cosmic-applet-aarch64-linux.tar.gz` | ARM64 | Receiver — COSMIC on ARM64 |
            | `sha256sums.txt` | — | Checksums for all binaries |

            ### Pairing flow

            1. Install the **receiver** (cosmic-applet) on your desktop — local stats appear immediately.
            2. Install the **sender** (nmd-service) on each remote machine — it automatically TCP-connects
               and requests pairing. Accept the request in the applet UI.
            3. Remote machine metrics appear within seconds of acceptance.
